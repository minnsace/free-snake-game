<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Snake Voice Chat</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #112e16; color: #daf6e2; }
    body { margin: 0; padding: 14px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 8px 0; font-size: 14px; }
    button, a { font: inherit; }
    button { padding: 10px 12px; margin: 4px 4px 4px 0; border: 1px solid #5bcd82; border-radius: 6px; background: #246b3d; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    a { color: #a1ffc0; }
    #error { color: #ffb9ad; }
    #presence { font-weight: bold; }
    .note { font-size: 12px; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script defer src="voice.js"></script>
</head>
<body>
  <h1>Shared voice chat</h1>
  <p id="status" role="status" aria-live="polite">Connecting...</p>
  <p id="presence" aria-live="polite">Checking who is in voice chat...</p>
  <button id="alerts">Enable alerts / test sound</button>
  <button id="join" disabled>Join voice chat</button>
  <button id="leave" hidden>Leave voice chat</button>
  <button id="mute" hidden>Mute microphone</button>
  <button id="play" hidden>Play incoming audio</button>
  <p id="error" role="alert"></p>
  <p class="note">Public room. Keep this page open and your phone unlocked. Click Enable alerts on your computer. Headphones recommended.</p>
  <a href="voice.html" target="_top">Open voice-only page</a>
</body>
</html>
